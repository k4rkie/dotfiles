bind b set -g status
bind r source-file "~/.tmux.conf"
bind t popup -h 80% -w 80% -E $SHELL

set -g prefix C-Space
set -g base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-style "bg=#030303,fg=#969696"

# Set current window color directly inside current-format instead
set -g window-status-current-style ""

# Clear out left and right sides
set -g status-left ""
set -g status-right ""

set -g mouse on
setw -g mode-keys vi

# Push window tabs to the right (options: left, centre, right)
set -g status-justify right

# Session block on the far left
set -g status-left "#[fg=#696969,bg=#121212,bold]  #S #[bg=default]"
set -g status-left-length 50

# Clear the right side so it doesn't crowd the windows
set -g status-right ""

# Window components
set -g window-status-format "#[fg=#696969,bg=#121212] #I:#W #[bg=default]"
set -g window-status-current-format "#[fg=#696969,bg=#121212,bold] #I:#W* #[bg=default]"

set -sg escape-time 0

set -g visual-activity off
set-option -g focus-events on

bind -n C-BSpace send-keys C-w

# Allow escape sequences to pass through Tmux to Kitty
set -g allow-passthrough on

# Enable extended keys and 24-bit true color
set -s extended-keys on
set -as terminal-features ',xterm-kitty:extkeys'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

bind-key -r f run-shell "tmux neww ~/scripts/tmux-session-dispensary.sh"
