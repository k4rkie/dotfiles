$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show

# ─── Layer Rules ────────────────────────────────────────────
layerrule = blur on, match:namespace dunst

# ─── Autostart ───────────────────────────────────────────────
exec-once = nm-applet
exec-once = blueman-applet
exec-once = dunst
exec-once = killall swaybg; swaybg -i /home/k4rkie/Pictures/CachyWalls/Wallhaven/wallhaven-og23ep.jpg -m fill
exec-once = wlsunset -l 27.7006 -L 83.4484 -t 3800 -T 6500
exec-once = gsettings set org.gnome.desktop.interface font-name 'IosevkaTerm Nerd Font 12'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Kripton-v40'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'AdwaitaLegacy'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = waybar

# ─── Input ───────────────────────────────────────────────────
input {
    kb_options = caps:escape
    natural_scroll = yes
    touchpad {
        natural_scroll = yes
        drag_lock = yes
    }
}

gesture = 3, horizontal, workspace

# ─── General ─────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0
    col.active_border = rgb(888888)
    col.inactive_border = rgb(202020)
    layout = dwindle
}

decoration {
    rounding = 4
    active_opacity = 0.95
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 12
        render_power = 4
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = yes
        size = 10
        passes = 4
        noise = 0.01
        contrast = 0.9
    }
}

animations {
    enabled = yes
    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.5, 0.0, 0.5, 1.0
    animation = windows, 1, 3, snappy, slide
    animation = windowsOut, 1, 3, snappy, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 3, snappy
    animation = workspaces, 1, 2, snappy, slide
    animation = global, 1, 5, default
}

# ─── Media Keys ──────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, ~/scripts/volume.sh up
bind = , XF86AudioLowerVolume, exec, ~/scripts/volume.sh down
bind = , XF86AudioMute, exec, ~/scripts/volume.sh mute
bind = , XF86MonBrightnessUp, exec, ~/scripts/brightness.sh up
bind = , XF86MonBrightnessDown, exec, ~/scripts/brightness.sh down

# ─── Screenshots ─────────────────────────────────────────────
bind = , Print, exec, grim ~/Pictures/Screenshots/screenshot_$(date +%F_%T).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot_$(date +%F_%T).png

# ─── Launcher / Session ──────────────────────────────────────
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, /opt/zen-browser/zen
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, D, exec, $menu
bind = $mainMod, Escape, exec, rofi -show powermenu -modi powermenu:~/scripts/rofi-power-menu
bind = $mainMod SHIFT, S, exec, ~/scripts/rofi-sessionizer.sh
bind = $mainMod SHIFT, C, exec, hyprctl reload

# ─── Focus Movement ──────────────────────────────────────────
bind = $mainMod, j, movefocus, l
bind = $mainMod, k, movefocus, d
bind = $mainMod, l, movefocus, u
bind = $mainMod, semicolon, movefocus, r

bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# ─── Move Window ─────────────────────────────────────────────
bind = $mainMod SHIFT, j, movewindow, l
bind = $mainMod SHIFT, k, movewindow, d
bind = $mainMod SHIFT, l, movewindow, u
bind = $mainMod SHIFT, semicolon, movewindow, r

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# ─── Mouse ──────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─── Layout / Windows ────────────────────────────────────────
bind = $mainMod, h, layoutmsg, preselect l
bind = $mainMod, v, layoutmsg, preselect d
bind = $mainMod, f, fullscreen,
bind = $mainMod, w, togglegroup,
bind = $mainMod, e, layoutmsg, togglesplit
bind = $mainMod SHIFT, t, togglefloating,
bind = $mainMod, space, cyclenext,
bind = $mainMod, a, layoutmsg, focusparent

# ─── Workspaces ──────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ─── Resize Mode ─────────────────────────────────────────────
bind = $mainMod, R, submap, resize
submap = resize
bind = , j, resizeactive, -5 0
bind = , k, resizeactive, 0 5
bind = , l, resizeactive, 0 -5
bind = , semicolon, resizeactive, 5 0
bind = , Left, resizeactive, -10 0
bind = , Down, resizeactive, 0 10
bind = , Up, resizeactive, 0 -10
bind = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# ─── Monitor ─────────────────────────────────────────────────
monitor = eDP-1, preferred, auto, 1
