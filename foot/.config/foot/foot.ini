# Foot terminal config
# Translated from kitty/.config/kitty/kitty.conf + current-theme.conf

[main]
font=IosevkaTerm Nerd Font:size=18
pad=0x0 center
resize-by-cells=no

[cursor]
style=block
blink=no

[colors-dark]
# base16: black-metal-bathory-tweaked
foreground=c1c1c1
background=030303
selection-foreground=030303
selection-background=121212

## Normal/regular colors (base16 0x08-0x0F)
regular0=030303
regular1=7D718F
regular2=d9af82
regular3=e78a53
regular4=696969
regular5=999999
regular6=aaaaaa
regular7=c1c1c1

## Bright colors
bright0=333333
bright1=7D718F
bright2=d9af82
bright3=e78a53
bright4=696969
bright5=999999
bright6=aaaaaa
bright7=c1c1c1
