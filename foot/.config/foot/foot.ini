# Foot terminal config
# Translated from kitty/.config/kitty/kitty.conf + current-theme.conf

[main]
font=IosevkaTerm Nerd Font:size=20
pad=4x4 center
resize-by-cells=no

[cursor]
style=block
blink=no

[colors-dark]
# base16: black-metal-bathory-tweaked
foreground=c1c1c1
background=030303
selection-foreground=030303
selection-background=121212

## Normal/regular colors (base16 0x08-0x0F)
regular0=030303
regular1=7f7094
regular2=d1a76b
regular3=d6b38d
regular4=696969
regular5=999999
regular6=aaaaaa
regular7=c1c1c1

## Bright colors
bright0=333333
bright1=7f7094
bright2=d1a76b
bright3=d6b38d
bright4=696969
bright5=999999
bright6=aaaaaa
bright7=c1c1c1
