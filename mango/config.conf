# ─── Monitor ───
monitorrule=name:^eDP-1$,width:0,height:0,refresh:0,x:0,y:0,scale:1,vrr:0,rr:0

# ─── Keyboard ───
xkb_rules_layout=us
xkb_rules_options=caps:escape

# ─── Trackpad ───
trackpad_natural_scrolling=1
drag_lock=1
tap_to_click=1
tap_and_drag=1

# ─── Cursor ───
cursor_size=24
cursor_theme=Adwaita

# ─── Group/Tab Bar ───
group_bar_height=28
group_bar_decorate_fg_color=0x888888ff
group_bar_decorate_bg_color=0x080808ff
group_bar_decorate_focus_fg_color=0xddddddff
group_bar_decorate_focus_bg_color=0x1a1a1aff
group_bar_decorate_border_color=0x0a0a0aff
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=0
group_bar_decorate_padding_x=8
group_bar_decorate_padding_y=2
group_bar_decorate_font_desc=monospace 14

# ─── Gaps / Borders / Colors ───
gappih=8
gappiv=8
gappoh=8
gappov=8
borderpx=0
rootcolor=0x030303ff
bordercolor=0x080808ff
focuscolor=0x919191ff
urgentcolor=0xad401fff

# ─── Opacity ───
focused_opacity=1.0
unfocused_opacity=1.0
border_radius=0

# ─── Blur ───
blur=0
blur_optimized=1
blur_params_radius=10
blur_params_num_passes=1
blur_params_noise=0.08
blur_params_brightness=0.5
blur_params_contrast=4.0
blur_params_saturation=2.8

# ─── Shadows ───
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=8
shadows_blur=6
shadows_position_x=-8
shadows_position_y=-8
shadowscolor=0x00000099

# ─── Layout (Scroller) ───
scroller_structs=10
scroller_default_proportion=0.9
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
circle_layout=scroller,vertical_scroller,dwindle

# ─── Animations ───
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=zoom
animation_duration_move=140
animation_duration_open=150
animation_duration_close=150
animation_duration_tag=140
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_close=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99
layer_animation_type_open=slide
layer_animation_type_close=slide

# ─── Misc ───
smartgaps=0

# ─── Sub-configs ───
source=~/.config/mango/bind.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/autostart.conf
