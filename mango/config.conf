# ─── Monitor ───
monitorrule=name:^eDP-1$,width:0,height:0,refresh:0,x:0,y:0,scale:1,vrr:0,rr:0

# ─── Keyboard ───
xkb_rules_layout=us
xkb_rules_options=caps:escape

# ─── Trackpad ───
trackpad_natural_scrolling=1
drag_lock=1
tap_to_click=1
tap_and_drag=1

# ─── Gaps / Borders / Colors ───
gappih=6
gappiv=6
gappoh=6
gappov=6
borderpx=2
rootcolor=0x030303ff
bordercolor=0x171717ff
focuscolor=0x8ab5beff
urgentcolor=0xad401fff

# ─── Opacity ───
focused_opacity=0.96
unfocused_opacity=0.88
border_radius=0

# ─── Blur ───
blur=1
blur_optimized=1
blur_params_radius=12
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.75
blur_params_contrast=0.90
blur_params_saturation=1.2

# ─── Shadows ───
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=8
shadows_blur=6
shadows_position_x=-8
shadows_position_y=-8
shadowscolor=0x00000099

# ─── Layout (Scroller) ───
scroller_structs=10
scroller_default_proportion=0.9
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
circle_layout=scroller,vertical_scroller,dwindle

# ─── Animations ───
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=zoom
animation_duration_open=190
animation_duration_close=240
animation_duration_tag=190
animation_duration_move=190
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_close=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
layer_animation_type_open=slide
layer_animation_type_close=slide

# ─── Misc ───
smartgaps=0

# ─── Sub-configs ───
source=~/.config/mango/bind.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/autostart.conf

