# ─── Monitor ───
monitor_rule=name:^eDP-1$,width:0,height:0,refresh:0,x:0,y:0,scale:1,vrr:0,rr:0

# ─── Keyboard ───
xkb_rules_layout=us
xkb_rules_options=caps:escape
repeat_rate=35
repeat_delay=225

# ─── Trackpad ───
trackpad_natural_scrolling=1
drag_lock=1
tap_to_click=1
tap_and_drag=1

# ─── Gaps / Borders / Colors ───
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=0
root_color=0x030303ff
border_color=0x202020ff
focus_color=0x98b5b9ff
urgent_color=0xad401fff

# ─── Opacity ───
focused_opacity=1.0
unfocused_opacity=1.0
border_radius=0

# ─── Blur ───
blur=0
blur_optimized=1
blur_params_radius=12
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.75
blur_params_contrast=0.90
blur_params_saturation=1.2

# ─── Shadows ───
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=8
shadows_blur=6
shadows_position_x=-8
shadows_position_y=-8
shadows_color=0x00000099

# ─── Layout (Scroller) ───
scroller_structs=10
scroller_default_proportion=0.9
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
circle_layout=scroller,dwindle,fair

# ─── Animations ───
animations=0
layer_animations=0
animation_type_open=slide
animation_type_close=zoom
animation_duration_open=170
animation_duration_close=220
animation_duration_tag=170
animation_duration_move=170
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_close=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
layer_animation_type_open=zoom
layer_animation_type_close=slide
tag_animation_direction=1

# ─── Misc ───
smart_gaps=0

# ─── Sub-configs ───
source=~/.config/mango/bind.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/autostart.conf
