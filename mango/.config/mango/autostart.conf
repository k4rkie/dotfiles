# ─── Tray / System ───
exec-once=nm-applet
exec-once=blueman-applet

# ─── Shell / Bar / Notifications / OSD ───
exec-once=quickshell
exec-once=waybar
exec-once=swaync
exec-once=swayosd-server
exec-once=awww-daemon

# ─── Idle daemon ───
# Lock after 4m → screen off after 5m → suspend after 10m
# Replace eDP-1 if your monitor has a different name
exec-once=swayidle -w \
  timeout 240 'swaylock -f' \
  timeout 300 'mmsg dispatch sleep_monitor eDP-1' resume 'mmsg dispatch wakeup_monitor eDP-1' \
  timeout 600 'systemctl suspend' \
  before-sleep 'swaylock -f'

# ─── Notification helper ───
exec-once=/home/k4rkie/scripts/mpd-notify.sh

# ─── Clipboard history ───
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# ─── Wallpaper ───
exec-once=sh -c 'sleep 0.5 && FB="/home/k4rkie/Pictures/Wallhaven/sea_sky_clouds_sand_beach_beacon_sunset_purple.jpg" && C="$HOME/.cache/quickshell/last-wallpaper" && if [ -f "$C" ]; then W=$(head -1 "$C"); case "$W" in video:*|"") ;; *) awww img "$W" --transition-type none; exit 0;; esac; fi; awww img "$FB" --transition-type none'

# ─── Night light ───
exec-once=wlsunset -l 27.7006 -L 83.4484 -t 3800 -T 6500
