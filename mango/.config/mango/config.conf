# ─── Monitor ───
monitorrule=name:^eDP-1$,width:0,height:0,refresh:0,x:0,y:0,scale:1,vrr:0,rr:0

# ─── Keyboard ───
xkb_rules_layout=us
xkb_rules_options=caps:escape

# ─── Trackpad ───
trackpad_natural_scrolling=1
drag_lock=1
tap_to_click=1
tap_and_drag=1

# ─── Cursor ───
cursor_size=24
cursor_theme=Adwaita

# ─── Gaps / Borders / Colors ───
gappih=4
gappiv=4
gappoh=8
gappov=8
borderpx=3
rootcolor=0x040408ff
bordercolor=0x202020ff
focuscolor=0x7d718fff
urgentcolor=0xad401fff

# ─── Opacity ───
focused_opacity=1.0
unfocused_opacity=0.95
border_radius=0

# ─── Blur ───
blur=1
blur_optimized=1
blur_params_radius=6
blur_params_num_passes=3
blur_params_noise=0.08
blur_params_brightness=0.5
blur_params_contrast=4.0
blur_params_saturation=2.8

# ─── Shadows ───
shadows=0

# ─── Layout (Scroller) ───
scroller_structs=20
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
circle_layout=scroller,vertical_scroller,tile,grid,dwindle

# ─── Animations ───
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_duration_move=200
animation_duration_open=150
animation_duration_tag=150
animation_duration_close=150
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_close=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
layer_animation_type_open=zoom
layer_animation_type_close=fade

# ─── Misc ───
smartgaps=0

# ─── Sub-configs ───
source=~/.config/mango/bind.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/autostart.conf
