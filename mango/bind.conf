# ─── Mouse Binds ───
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ─── 3-Finger Gestures (tag switch) ───
gesturebind=NONE,left,3,viewtoright_have_client
gesturebind=NONE,right,3,viewtoleft_have_client

# ─── Media Keys ───
bind=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume +2
bind=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume -2
bind=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness +2
bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness -2
bind=NONE,XF86AudioPlay,spawn,mpc toggle
bind=NONE,XF86AudioNext,spawn,mpc next
bind=NONE,XF86AudioPrev,spawn,mpc prev
bind=NONE,XF86AudioStop,spawn,mpc stop

# ─── Launcher / Session ───
bind=SUPER,Return,spawn,footclient
bind=SUPER,b,spawn,firefox
bind=SUPER+SHIFT,f,spawn,thunar
bind=SUPER+SHIFT,q,killclient
bind=SUPER,d,spawn,rofi -show
binds=SUPER,Escape,spawn,quickshell ipc call control openPower
bind=SUPER,p,spawn,hyprpicker -a -n
bind=SUPER+SHIFT,s,spawn,/home/k4rkie/scripts/rofi-sessionizer.sh
bind=SUPER+SHIFT,c,spawn,/home/k4rkie/scripts/reload.sh
bind=SUPER+SHIFT,b,spawn,quickshell ipc call statusbar toggle
bind=SUPER+SHIFT,u,spawn,rofi -show Utils -modi Utils:/home/k4rkie/scripts/utils-menu.sh

# bind=SUPER,v,spawn,~/scripts/rofi-cliphist.sh
bind=SUPER,v,spawn,quickshell ipc call control openClipboard 
bind=SUPER,period,spawn,quickshell ipc call launcher openEmoji
bind=SUPER,w,spawn,quickshell ipc call control openWallpaper

# ─── Focus Movement ───
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# ─── Swap / Move Window ───
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ─── Group ───
bind=SUPER,g,groupjoin,right
bind=SUPER+SHIFT,g,groupleave
bind=SUPER,Tab,groupfocus,next
bind=SUPER+SHIFT,Tab,groupfocus,prev

# ─── Layout / Windows ───
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,t,togglefloating
bind=SUPER,space,focusstack,next
bind=SUPER+SHIFT,P,switch_layout
bind=ALT,Tab,togglejump

# ─── Tags (Workspaces 1-9, 0 = all tags) ───
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,0

# ─── Resize Submap ───
keymode=resize
bind=NONE,h,resizewin,-5,0
bind=NONE,j,resizewin,0,5
bind=NONE,k,resizewin,0,-5
bind=NONE,l,resizewin,5,0
bind=NONE,Left,resizewin,-10,0
bind=NONE,Down,resizewin,0,10
bind=NONE,Up,resizewin,0,-10
bind=NONE,Right,resizewin,10,0
bind=NONE,Return,setkeymode,default
binds=NONE,Escape,setkeymode,default
bind=SUPER,r,setkeymode,default

keymode=default
bind=SUPER,r,setkeymode,resize

bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps
